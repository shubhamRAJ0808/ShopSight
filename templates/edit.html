<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Edit Sale — ShopSight</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // Apply saved theme immediately to avoid flash
    (function() {
      const t = localStorage.getItem('xyz-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">SS</div>
    <div class="logo-text">
      <span class="logo-title">ShopSight</span>
      <span class="logo-sub">Forecasting Dashboard</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a href="/" class="nav-item"><span class="nav-icon">◀</span> Back to Dashboard</a>
  </nav>
  <div class="sidebar-footer">
    <div class="live-dot"></div>
    <span id="live-time-side"></span>
  </div>
</aside>

<main class="main-content">

  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="page-title">
        <h1>Edit Sale</h1>
        <span class="page-sub">Modify entry #{{ sale.id }}</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="topbar-theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </header>

  <section style="padding:28px 32px;max-width:560px;">
    <div class="form-card">
      <div class="form-card-header"><h3>✏ Edit Sale #{{ sale.id }}</h3></div>
      <form action="/edit/{{ sale.id }}" method="POST" class="sale-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" name="product" value="{{ sale.product }}" required>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" value="{{ sale.quantity }}" min="1" required>
          </div>
          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" name="price" value="{{ sale.price }}" min="0" step="0.01" required>
          </div>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date" value="{{ sale.date }}">
        </div>
        <div class="form-row-2">
          <button type="submit" class="btn-primary">Save Changes</button>
          <a href="/" class="btn-secondary" style="text-align:center;text-decoration:none;padding:11px;border-radius:8px;display:block;">Cancel</a>
        </div>
      </form>
    </div>
  </section>

</main>

<script>
let isDark = localStorage.getItem('xyz-theme') !== 'light';

function applyTheme(dark) {
  isDark = dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  localStorage.setItem('xyz-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = dark ? '🌙 Dark' : '☀ Light';
}
function toggleTheme() { applyTheme(!isDark); }
applyTheme(isDark);

function updateClock() {
  const t = new Date().toLocaleString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit', day:'2-digit', month:'short', year:'numeric' });
  const el = document.getElementById('live-time-side');
  if (el) el.textContent = t;
}
setInterval(updateClock, 1000);
updateClock();

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
}
</script>
</body>
</html>
