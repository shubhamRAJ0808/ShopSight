<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Create Your Shop — ShopSight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080c14;
      --surface: #0f1623;
      --surface2:#151d2e;
      --border:  #1e2d45;
      --blue:    #4f8ef7;
      --green:   #22d3a0;
      --purple:  #a78bfa;
      --text:    #e2eaf6;
      --text2:   #8fa3c0;
      --text3:   #4d6480;
      --red:     #f87171;
      --mono:    'JetBrains Mono', monospace;
      --body:    'Outfit', sans-serif;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height: auto; }
    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 0;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(79,142,247,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,142,247,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove { to { background-position: 40px 40px; } }
    .orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
    .orb-1 { width:400px;height:400px; background:rgba(34,211,160,.08); top:-100px; right:-100px; animation:float1 8s ease-in-out infinite; }
    .orb-2 { width:350px;height:350px; background:rgba(167,139,250,.07); bottom:-80px; left:-80px; animation:float2 10s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-30px)} }

    .login-wrap { position:relative; z-index:10; width:100%; max-width:440px; padding:20px; }

    .login-logo { display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:28px; }
    .logo-mark {
      width:46px; height:46px; border-radius:12px;
      background: linear-gradient(135deg, #22d3a0, #4f8ef7);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-weight:700; font-size:14px; color:#fff;
      letter-spacing:1px; box-shadow: 0 0 24px rgba(34,211,160,.3);
    }
    .logo-text { text-align:left; }
    .logo-title { display:block; font-size:20px; font-weight:800; letter-spacing:-.3px; }
    .logo-sub   { display:block; font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:.8px; }

    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 36px 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .login-card h2 { font-size:22px; font-weight:700; margin-bottom:6px; }
    .login-card p  { font-size:13px; color:var(--text2); margin-bottom:26px; }

    .form-group { display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
    label { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text2); font-weight:600; }

    .input-wrap { position:relative; }
    .input-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--text3); pointer-events:none; }
    input[type="text"], input[type="password"] {
      width:100%; background:var(--bg); border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-family:var(--body);
      font-size:14px; padding:11px 13px 11px 40px;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(34,211,160,.12); }
    .toggle-pw { position:absolute; right:13px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:15px; color:var(--text3); user-select:none; }
    .hint-text { font-size:11px; color:var(--text3); margin-top:5px; }

    .btn-register {
      width:100%; background:linear-gradient(135deg,#22d3a0,#4f8ef7);
      color:#fff; border:none; border-radius:10px;
      font-family:var(--body); font-size:15px; font-weight:700;
      padding:13px; cursor:pointer; margin-top:6px;
      transition:opacity .2s, transform .1s;
      box-shadow:0 6px 20px rgba(34,211,160,.25);
    }
    .btn-register:hover  { opacity:.9; }
    .btn-register:active { transform:scale(.98); }

    .error-box {
      background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3);
      border-radius:10px; padding:12px 16px; margin-bottom:20px;
      color:var(--red); font-size:13px; display:flex; align-items:center; gap:8px;
      animation: shake .4s ease;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .login-footer { text-align:center; margin-top:20px; font-size:12px; color:var(--text3); }
    .login-footer a { color:var(--blue); text-decoration:none; font-weight:600; }
    .login-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrap">
    <div class="login-logo">
      <div class="logo-mark">SS</div>
      <div class="logo-text">
        <span class="logo-title">ShopSight</span>
        <span class="logo-sub">Set up your shop</span>
      </div>
    </div>

    <div class="login-card">
      <h2>Create your account 🚀</h2>
      <p>Each shop gets its own private dashboard and login.</p>

      {% if error %}
      <div class="error-box">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/register">
        <div class="form-group">
          <label>Shop / Business Name</label>
          <div class="input-wrap">
            <span class="input-icon">🏬</span>
            <input type="text" name="shop_name" placeholder="e.g. Sharma Electronics"
                   value="{{ request.form.get('shop_name','') }}" required autofocus>
          </div>
        </div>
        <div class="form-group">
          <label>Your Full Name</label>
          <div class="input-wrap">
            <span class="input-icon">🧑</span>
            <input type="text" name="full_name" placeholder="e.g. Shubham Raj"
                   value="{{ request.form.get('full_name','') }}" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input type="text" name="email" placeholder="you@example.com"
                   value="{{ request.form.get('email','') }}" required>
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" name="username" placeholder="Choose a login username"
                   value="{{ request.form.get('username','') }}" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" id="pwField" placeholder="At least 8 characters" required
                   minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                   title="8+ characters, with uppercase, lowercase, a number, and a special character">
            <span class="toggle-pw" onclick="togglePw('pwField')">👁</span>
          </div>
          <span class="hint-text">8+ characters, with an uppercase letter, a lowercase letter, a number, and a special character.</span>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" name="confirm_password" id="pwField2" placeholder="Re-enter password" required minlength="8">
            <span class="toggle-pw" onclick="togglePw('pwField2')">👁</span>
          </div>
        </div>
        <button type="submit" class="btn-register">Create Shop Account →</button>
      </form>

      <div class="login-footer">Already have an account? <a href="/login">Sign in</a></div>
    </div>
  </div>

  <script>
    function togglePw(id) {
      const f = document.getElementById(id);
      f.type = f.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
